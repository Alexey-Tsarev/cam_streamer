# Android IP Webcam

name: shelP9000
active: True

src: 'rtsp://10.1.7.241:8080/h264_pcm.sdp'

cmd: '''
    exec gst-launch-1.0 \
        rtspsrc location="''' + $src + '''" latency=0 name=src \
        src. \
            ! queue max-size-buffers=10 \
            ! capsfilter caps="application/x-rtp,media=video" \
            ! rtph264depay \
            ! h264parse \
            ! queue max-size-buffers=10 \
            ! mux.video \
        src. \
            ! queue max-size-buffers=10 \
            ! capsfilter caps="application/x-rtp,media=audio" \
            ! decodebin \
            ! audioconvert \
            ! audioresample \
            ! "audio/x-raw,rate=22050,channels=1" \
            ! avenc_aac bitrate=24000 \
            ! aacparse \
            ! queue max-size-buffers=10 \
            ! mux.audio \
        flvmux name=mux \
            ! rtmpsink location="rtmp://''' + $cam_stream_root + $name + '''"
'''

max_start_seconds: 120
