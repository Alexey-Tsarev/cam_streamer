# 046d:09a4 Logitech, Inc. QuickCam E 3500 (Logitech E3500)
# v4l2-ctl -d /dev/video0 --list-formats-ext

name: cam1
active: True

dev_fs_mask: 'by-id/usb-046d_09a4_C9469E20-*'

cmd: '''
    exec gst-launch-1.0 \
        v4l2src device=`ls /dev/v4l/''' + $dev_fs_mask + '''-index0` do-timestamp=true \
            ! videorate \
            ! "video/x-raw,framerate=5/1" \
            ! clockoverlay time-format="''' + $name + ''' %Y-%m-%d %H:%M:%S" xpad=0 ypad=0 font-desc="Lucida Console Bold 24" auto-resize=0 shaded-background=1 \
            ! timeoverlay halignment=left valignment=bottom text="''' + $name + '''" shaded-background=true font-desc="Sans, 8" \
            ! videoconvert \
            ! x264enc tune=zerolatency speed-preset=veryfast bitrate=500 key-int-max=10 \
            ! "video/x-h264,profile=baseline" \
            ! h264parse \
            ! queue max-size-buffers=10 \
            ! mux.video \
        alsasrc device=hw:`readlink /dev/snd/''' + $dev_fs_mask + ''' | sed 's/[^0-9]*//g'` do-timestamp=true provide-clock=false \
            ! audioconvert \
            ! rgvolume pre-amp=6.0 headroom=10.0 \
            ! rglimiter \
            ! audioresample \
            ! "audio/x-raw,rate=22050,channels=1" \
            ! audioconvert \
            ! voaacenc bitrate=24000 \
            ! aacparse \
            ! queue max-size-buffers=10 \
            ! mux.audio \
        flvmux name=mux \
            ! rtmpsink location="rtmp://''' + $cam_stream_root + $name + '''"
'''

max_start_seconds: 120
reset_cmd: 'sudo ./usbreset_by_id.sh /dev/v4l/' + $dev_fs_mask
